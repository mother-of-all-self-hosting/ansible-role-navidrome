---
- name: Verify Navidrome
  hosts: all
  become: true
  gather_facts: false

  vars:
    navidrome_verify_base_url: "http://localhost:4533"
    navidrome_verify_admin_username: molecule
    navidrome_verify_admin_password: molecule-verify-password
    # Every Subsonic request has to announce the protocol version it speaks and
    # name the client making it, so these travel along with the credentials.
    navidrome_verify_subsonic_query: >-
      u={{ navidrome_verify_admin_username }}&p={{ navidrome_verify_admin_password }}&v=1.16.1&c=molecule&f=json

    navidrome_verify_units:
      - navidrome.service

  tasks:
    - name: Verify that Navidrome works
      block:
        - name: Run the shared Navidrome verification
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Navidrome systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=navidrome.service
          register: navidrome_service_log
          changed_when: false

        - name: Show the Navidrome systemd service log
          ansible.builtin.debug:
            var: navidrome_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Navidrome verification failed. The systemd service log is printed above."
