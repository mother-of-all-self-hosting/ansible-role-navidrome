---
# This play does not include the role, so its defaults are not in scope.
# Reading defaults/main.yml directly ties the version assertion below to the
# value that Renovate bumps, with nothing to keep in sync in this scenario.
# The `name` keeps these out of the way of the scenario's group_vars.
- name: Load the Navidrome role defaults
  ansible.builtin.include_vars:
    file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    name: navidrome_defaults

- name: Wait for Navidrome service to become active (up to 180s)
  ansible.builtin.systemd:
    name: navidrome.service
  register: navidrome_service
  until: navidrome_service.status.ActiveState == 'active'
  retries: 36
  delay: 5

- name: Assert Navidrome service is active
  ansible.builtin.assert:
    that: navidrome_service.status.ActiveState == 'active'
    fail_msg: "navidrome.service not active ({{ navidrome_service.status.ActiveState }})"
    success_msg: "navidrome.service is active"

- name: Retrieve Navidrome service log for debugging
  when: navidrome_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: journalctl -xeu navidrome.service
  changed_when: false

# Navidrome's own liveness endpoint. It only tells us that the HTTP listener
# is up - a Navidrome that has not been set up yet answers it just as
# happily - so it serves as the wait loop for the real probes below.
- name: Wait for the Navidrome liveness endpoint to answer (up to 300s)
  ansible.builtin.uri:
    url: "{{ navidrome_verify_base_url }}/ping"
    method: GET
    status_code: [200]
  register: navidrome_ping
  until: navidrome_ping.status == 200
  retries: 60
  delay: 5

# A fresh Navidrome serves a "create the first administrator" wizard, and
# every page of the web interface renders for an unconfigured instance, so a
# 200 on `/` or `/app/` proves nothing on its own. Walking through the wizard
# is what separates a working deployment from a merely running binary: the
# account is written to the SQLite database that the role provisioned, which
# only succeeds once the schema migrations have run against it.
- name: Create the first Navidrome administrator account
  ansible.builtin.uri:
    url: "{{ navidrome_verify_base_url }}/auth/createAdmin"
    method: POST
    body_format: json
    body:
      username: "{{ navidrome_verify_admin_username }}"
      password: "{{ navidrome_verify_admin_password }}"
    status_code: [200]
    return_content: true
  register: navidrome_create_admin
  changed_when: true

- name: Assert the administrator account was created
  ansible.builtin.assert:
    that:
      - navidrome_create_admin.json.username == navidrome_verify_admin_username
      - navidrome_create_admin.json.isAdmin | bool
    fail_msg: "Unexpected /auth/createAdmin payload: {{ navidrome_create_admin.json | default('no payload') }}"
    success_msg: "The administrator account '{{ navidrome_verify_admin_username }}' was created"

# Reading the account back through a different subsystem (the Subsonic API,
# not the web interface's own auth endpoint) proves the credentials really
# landed in the database. This request answers `failed` for an instance that
# has not been through the wizard, so it cannot pass by accident.
- name: Authenticate against the Subsonic API
  ansible.builtin.uri:
    url: "{{ navidrome_verify_base_url }}/rest/ping.view?{{ navidrome_verify_subsonic_query }}"
    method: GET
    status_code: [200]
    return_content: true
  register: navidrome_subsonic_ping
  until: navidrome_subsonic_ping.json['subsonic-response'].status == 'ok'
  retries: 12
  delay: 5

- name: Assert the Subsonic API accepts the created credentials
  ansible.builtin.assert:
    that:
      - navidrome_subsonic_ping.json['subsonic-response'].status == 'ok'
      - navidrome_subsonic_ping.json['subsonic-response'].type == 'navidrome'
    fail_msg: "The Subsonic API rejected the request: {{ navidrome_subsonic_ping.json | default('no payload') }}"
    success_msg: "The Subsonic API authenticated '{{ navidrome_verify_admin_username }}'"

- name: Determine the version reported by the running Navidrome
  ansible.builtin.set_fact:
    navidrome_server_version: "{{ navidrome_subsonic_ping.json['subsonic-response'].serverVersion }}"

# Tying the running version to `navidrome_version` is what makes this
# scenario a test of the value that Renovate bumps: a bump to an image that
# does not exist, or that cannot serve, cannot pass here.
#
# Self-built images are exempt. Upstream's Dockerfile stamps the version from
# its `GIT_TAG` build argument, which this role does not pass, so a self-built
# Navidrome reports a placeholder version no matter what it was built from.
- name: Assert the running Navidrome is the version the role asks for
  when: not (navidrome_container_image_self_build | default(false) | bool)
  ansible.builtin.assert:
    # The reported version has the build's git hash appended
    # (`0.63.2 (be10f89c)`), hence the prefix match.
    that: navidrome_server_version is match(navidrome_defaults.navidrome_version | regex_escape)
    fail_msg: >-
      Navidrome reports version {{ navidrome_server_version | default('none') }},
      but the role asks for {{ navidrome_defaults.navidrome_version }}
    success_msg: "Navidrome reports version {{ navidrome_server_version }}"

# The music library that Navidrome created for the configured music folder,
# read back out of the database through the API.
- name: Query the music folders known to Navidrome
  ansible.builtin.uri:
    url: "{{ navidrome_verify_base_url }}/rest/getMusicFolders.view?{{ navidrome_verify_subsonic_query }}"
    method: GET
    status_code: [200]
    return_content: true
  register: navidrome_subsonic_music_folders

- name: Assert Navidrome serves its music library from the database
  ansible.builtin.assert:
    that:
      - navidrome_subsonic_music_folders.json['subsonic-response'].status == 'ok'
      - navidrome_subsonic_music_folders.json['subsonic-response'].musicFolders.musicFolder | length > 0
    fail_msg: "Navidrome reported no music folders: {{ navidrome_subsonic_music_folders.json | default('no payload') }}"
    success_msg: "Navidrome serves {{ navidrome_subsonic_music_folders.json['subsonic-response'].musicFolders.musicFolder | length }} music folder(s)"

# The scanner is a separate subsystem with its own access to the data
# directory, and it reports through the API only once it has run.
- name: Query the Navidrome scanner status
  ansible.builtin.uri:
    url: "{{ navidrome_verify_base_url }}/rest/getScanStatus.view?{{ navidrome_verify_subsonic_query }}"
    method: GET
    status_code: [200]
    return_content: true
  register: navidrome_subsonic_scan_status
  until: navidrome_subsonic_scan_status.json['subsonic-response'].scanStatus.lastScan is defined
  retries: 24
  delay: 5

- name: Assert the Navidrome scanner has completed a scan
  ansible.builtin.assert:
    that:
      - navidrome_subsonic_scan_status.json['subsonic-response'].scanStatus.lastScan is defined
      - not (navidrome_subsonic_scan_status.json['subsonic-response'].scanStatus.scanning | bool)
    fail_msg: "The Navidrome scanner did not complete a scan: {{ navidrome_subsonic_scan_status.json | default('no payload') }}"
    success_msg: "The Navidrome scanner completed a scan at {{ navidrome_subsonic_scan_status.json['subsonic-response'].scanStatus.lastScan }}"

# An actual page render, which exercises the static asset pipeline rather
# than just the HTTP listener. `/` redirects here.
- name: Retrieve the Navidrome web interface
  ansible.builtin.uri:
    url: "{{ navidrome_verify_base_url }}/app/"
    method: GET
    status_code: [200]
    return_content: true
  register: navidrome_web_interface

- name: Assert the Navidrome web interface is served
  ansible.builtin.assert:
    that: navidrome_web_interface.content is search('<title>Navidrome</title>')
    fail_msg: "The Navidrome web interface did not render as expected"
    success_msg: "The Navidrome web interface is served"

- name: Show Navidrome verification summary
  ansible.builtin.debug:
    msg:
      - "Navidrome systemd: {{ navidrome_service.status.ActiveState }}"
      - "Navidrome version: {{ navidrome_server_version }}"
      - "Subsonic API: {{ navidrome_subsonic_ping.json['subsonic-response'].status }}"
      - "Music folders: {{ navidrome_subsonic_music_folders.json['subsonic-response'].musicFolders.musicFolder | length }}"
      - "Last scan: {{ navidrome_subsonic_scan_status.json['subsonic-response'].scanStatus.lastScan }}"
      - "Web interface: {{ navidrome_web_interface.status }}"
