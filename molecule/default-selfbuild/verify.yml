---
- name: Verify Navidrome
  hosts: all
  become: true
  gather_facts: false

  vars:
    navidrome_verify_base_url: "http://localhost:4533"
    navidrome_verify_admin_username: molecule
    navidrome_verify_admin_password: molecule-verify-password
    # Every Subsonic request has to announce the protocol version it speaks and
    # name the client making it, so these travel along with the credentials.
    navidrome_verify_subsonic_query: >-
      u={{ navidrome_verify_admin_username }}&p={{ navidrome_verify_admin_password }}&v=1.16.1&c=molecule&f=json

  tasks:
    - name: Run the shared Navidrome verification
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"
